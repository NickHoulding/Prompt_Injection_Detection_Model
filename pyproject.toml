[project]
name = "prompt-injection-detection-model"
version = "0.1.0"
description = "Prompt injection detection using custom logistic regression and neural network models trained on Ollama text embeddings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "black>=26.5.1",
    "datasets>=4.0.0",
    "mypy>=2.3.1",
    "nltk>=3.9.1",
    "numpy>=2.1.3",
    "ollama>=0.5.1",
    "pandas>=2.3.1",
    "pandas-stubs>=3.0.5.260914",
    "scikit-learn>=1.7.1",
    "tensorflow>=2.19.0",
    "types-tensorflow>=2.18.0.20260827",
]

[[tool.mypy.overrides]]
module = ["nltk.*", "sklearn.*", "datasets.*"]
ignore_missing_imports = true
